# Placeholder namespace-scoped permissions required by OLM to create the
# velero ServiceAccount when the CSV is installed in AllNamespaces mode.
# Velero does not perform leader election; these rules mirror the manager's
# leader-election Role.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: velero-leader-election-role
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
