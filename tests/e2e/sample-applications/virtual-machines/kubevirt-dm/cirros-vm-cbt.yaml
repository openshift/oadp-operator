apiVersion: v1
kind: Namespace
metadata:
  name: cirros-test
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  labels:
    app: cirros-test
    changedBlockTracking: "true"
  name: cirros-test
  namespace: cirros-test
spec:
  dataVolumeTemplates:
  - metadata:
      annotations:
        cdi.kubevirt.io/storage.deleteAfterCompletion: "false"
      name: cirros-test-disk
    spec:
      pvc:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 150Mi
        #storageClassName: gp3-csi
        volumeMode: Block
      source:
        registry:
          pullMethod: node
          url: docker://quay.io/kubevirt/cirros-container-disk-demo
  running: true
  template:
    metadata:
      name: cirros-test
    spec:
      domain:
        devices:
          disks:
          - disk:
              bus: virtio
            name: volume0
          interfaces:
          - masquerade: {}
            name: default
          rng: {}
        resources:
          requests:
            memory: 256M
      networks:
      - name: default
        pod: {}
      terminationGracePeriodSeconds: 0
      volumes:
      - dataVolume:
          name: cirros-test-disk
        name: volume0
